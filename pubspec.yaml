name: my_portfolio
description: Omer Jahangir — Flutter developer portfolio, built as a static website with Jaspr.
publish_to: 'none'
version: 2.0.0

environment:
  sdk: ^3.10.0

dependencies:
  jaspr: ^0.23.5
  universal_web: ^1.1.0

dev_dependencies:
  build_runner: ^2.15.1
  build_web_compilers: ^4.8.5
  jaspr_builder: ^0.23.5
  jaspr_test: ^0.23.5
  lints: ^5.0.0

jaspr:
  mode: static
